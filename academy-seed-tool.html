<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Litdom Academy — Seed Tool (one-time use)</title>
<style>
  body { font-family: Arial, sans-serif; background: #0B0B0F; color: #FFF8E7; padding: 30px 20px; }
  button { padding: 14px 22px; background: #D4AF37; color: #0B0B0F; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  #status { margin: 14px 0; font-size: 14px; font-weight: bold; }
  #status.ok { color: #7ed957; }
  #status.error { color: #ff6b6b; }
  #log { margin-top: 20px; font-size: 13px; color: #AAA595; white-space: pre-wrap; }
</style>
</head>
<body>

<h2>Litdom Academy — One-Time Seed Tool</h2>
<p>This loads "Editor Academy" (Lesson 1) into Firestore. Run this once, then delete this page.</p>
<div id="status">Connecting to Firebase...</div>
<button id="seedBtn" disabled>Seed Editor Academy Course</button>
<div id="log"></div>

<script type="module">
  const statusEl = document.getElementById("status");
  const logEl = document.getElementById("log");
  const btn = document.getElementById("seedBtn");

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }
  function print(msg) { logEl.textContent += msg + "\n"; }

  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, doc, setDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

    const firebaseConfig = {
  apiKey: "AIzaSyAFL10yMCsxvE1QCFWMROlk6yMzweeSVew",
  authDomain: "litdom-academy.firebaseapp.com",
  projectId: "litdom-academy",
  storageBucket: "litdom-academy.firebasestorage.app",
  messagingSenderId: "488768172903",
  appId: "1:488768172903:web:933c616d81f5529979b5c2"
};

    if (firebaseConfig.apiKey.startsWith("REPLACE-WITH")) {
      setStatus("ERROR: Firebase config still has placeholder text — the 6 values weren't actually saved into this file.", "error");
      print("Check the firebaseConfig object near the top of the script — it still says REPLACE-WITH-... instead of your real values.");
      throw new Error("Config not replaced");
    }

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    setStatus("Connected. Ready to seed.", "ok");
    btn.disabled = false;

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      logEl.textContent = "";
      setStatus("Seeding...", "");
      try {
        const courseRef = doc(db, "courses", "editor-academy");
        await setDoc(courseRef, {
          title: "Editor Academy",
          description: "Learn the craft behind powerful writing.",
          level: "Beginner",
          duration_estimate: "4-6 hours",
          general_path_enabled: true,
          general_price: 0,
          practical_path_enabled: false,
          image_url: "",
          order_index: 1
        });
        print("Course created: editor-academy");

        const lessonRef = doc(collection(courseRef, "lessons"), "lesson-1");
        await setDoc(lessonRef, { title: "Fundamentals of Editing", order_index: 1 });
        print("Lesson created: Fundamentals of Editing");

        const moduleRef = doc(collection(lessonRef, "modules"), "module-1");
        await setDoc(moduleRef, { title: "Introduction", order_index: 1 });
        print("Module created: Introduction");

        const section1Ref = doc(collection(moduleRef, "sections"), "section-1");
        await setDoc(section1Ref, { title: "Who Is an Editor?", order_index: 1 });

        await setDoc(doc(collection(section1Ref, "content_blocks"), "block-1"), {
          order_index: 1, block_type: "text",
          config: { html: "<p>Before you can edit well, you must understand the person behind the edits.</p>" }
        });
        await setDoc(doc(collection(section1Ref, "content_blocks"), "block-2"), {
          order_index: 2, block_type: "video",
          config: { url: "REPLACE-WITH-VIDEO-EMBED-URL" }
        });
        await setDoc(doc(collection(section1Ref, "content_blocks"), "block-3"), {
          order_index: 3, block_type: "download",
          config: { url: "REPLACE-WITH-PDF-URL", label: "Download Lesson Workbook" }
        });
        print("Section + content blocks created: Who Is an Editor?");

        const section2Ref = doc(collection(moduleRef, "sections"), "section-2");
        await setDoc(section2Ref, { title: "What Does an Editor Do?", order_index: 2 });
        await setDoc(doc(collection(section2Ref, "content_blocks"), "block-1"), {
          order_index: 1, block_type: "text",
          config: { html: "<p>Good editing protects the author's voice while improving the manuscript.</p>" }
        });
        print("Section created: What Does an Editor Do?");

        const section3Ref = doc(collection(moduleRef, "sections"), "section-3");
        await setDoc(section3Ref, { title: "Editor-Author Relationship", order_index: 3 });
        await setDoc(doc(collection(section3Ref, "content_blocks"), "block-1"), {
          order_index: 1, block_type: "text",
          config: { html: "<p>An editor collaborates with the author while respecting the author's purpose and voice.</p>" }
        });
        print("Section created: Editor-Author Relationship");

        setStatus("DONE — all Editor Academy content is now in Firestore. You can delete this page now.", "ok");

      } catch (err) {
        setStatus("ERROR while seeding: " + err.message, "error");
        print("Full error: " + err.message);
        console.error(err);
        btn.disabled = false;
      }
    });

  } catch (err) {
    setStatus("ERROR connecting to Firebase: " + err.message, "error");
    print("Full error: " + err.message);
    console.error(err);
  }
</script>
</body>
</html>
